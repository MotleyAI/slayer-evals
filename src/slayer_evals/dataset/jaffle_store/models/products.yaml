version: 12
name: products
sql_table: products
source_kind: table
query_variables: {}
columns:
- name: sku
  sql: sku
  type: TEXT
  primary_key: true
  unique: false
  hidden: false
- name: name
  sql: name
  type: TEXT
  primary_key: false
  unique: false
  description: Product name.
  label: Product
  hidden: false
- name: type
  sql: type
  type: TEXT
  primary_key: false
  unique: false
  description: Product category.
  label: Category
  hidden: false
- name: price
  sql: price
  type: INT
  primary_key: false
  unique: false
  description: List price, in cents.
  label: Price (cents)
  hidden: false
  format:
    type: integer
- name: description
  sql: description
  type: TEXT
  primary_key: false
  unique: false
  description: Product description.
  label: Description
  hidden: false
measures:
- formula: sku:count_distinct
  name: product_count
  label: Products
  description: Number of distinct products.
  meta:
    format:
      type: integer
      symbol: null
      precision: 0
- formula: price:avg / 100.0
  name: avg_price
  label: Average Price
  description: Average list price, in dollars.
  meta:
    format:
      type: currency
      symbol: $
      precision: 2
aggregations:
- name: dollars
  formula: SUM({value}) / 100.0
  params: []
  description: Sum of an integer-cents column expressed in dollars.
joins: []
filters: []
hidden: false
