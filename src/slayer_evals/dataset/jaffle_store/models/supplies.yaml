version: 12
name: supplies
sql_table: supplies
source_kind: table
query_variables: {}
columns:
- name: id
  sql: id
  type: TEXT
  primary_key: true
  unique: false
  hidden: false
- name: name
  sql: name
  type: TEXT
  primary_key: false
  unique: false
  description: Supply name.
  label: Supply
  hidden: false
- name: cost
  sql: cost
  type: INT
  primary_key: false
  unique: false
  description: Cost per unit, in cents.
  label: Unit Cost (cents)
  hidden: false
  format:
    type: integer
- name: perishable
  sql: perishable
  type: BOOLEAN
  primary_key: false
  unique: false
  description: Whether the supply is perishable.
  label: Perishable
  hidden: false
- name: sku
  sql: sku
  type: TEXT
  primary_key: false
  unique: false
  description: 'Product this supply is used for. Not unique: a product has several supply rows (one per component).'
  label: Product
  hidden: false
measures:
- formula: cost:dollars
  name: total_supply_cost
  label: Total Supply Cost
  description: Total supply cost, in dollars.
  meta:
    format:
      type: currency
      symbol: $
      precision: 2
- formula: cost:avg / 100.0
  name: avg_unit_cost
  label: Avg Unit Cost
  description: Average supply unit cost, in dollars.
  meta:
    format:
      type: currency
      symbol: $
      precision: 2
aggregations:
- name: dollars
  formula: SUM({value}) / 100.0
  params: []
  description: Sum of an integer-cents column expressed in dollars.
joins:
- target_model: products
  join_pairs:
  - - sku
    - sku
  join_type: left
  cardinality: many_to_one
filters: []
hidden: false
