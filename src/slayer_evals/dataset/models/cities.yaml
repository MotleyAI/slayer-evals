name: cities
sql_table: cities
columns:
  - {name: city, type: string, primary_key: true}
  - {name: region_id, type: number, primary_key: true}
  - {name: population, type: number}
  - {name: size_class, type: string}
joins:
  - {target_model: regions, join_pairs: [[region_id, id]], cardinality: many_to_one}
