id: q25-credit-per-order
row: Q25
prompt: >-
  Across all orders that have a customer, what is the average credit limit of the ordering customer, with each order
  counting once (so a customer with many orders weighs more)?
truth_sql: |
  select avg(c.credit) as avg_credit from orders o join customers c on o.customer_id = c.id
compare: {values: [avg_credit]}
allow:
  - {construct: inline_column_sql, scope: row_scalar}
capabilities:
  - {kind: inline_extension}
