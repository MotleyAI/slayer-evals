id: q12-net-revenue
row: Q12
prompt: >-
  For each region, sum over its orders the order amount minus the ordering customer's discount value. Orders whose
  customer has no known region form their own group.
truth_sql: |
  select region, sum(amount - discount) as net_revenue from orders_flat group by 1
compare: {keys: [region], values: [net_revenue]}
