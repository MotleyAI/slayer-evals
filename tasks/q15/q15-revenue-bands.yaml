id: q15-revenue-bands
row: Q15
prompt: >-
  Put every customer who has placed at least one order into a band by their total revenue (the sum of their order
  amounts): under 1000, 1000 to under 2000, 2000 to under 3000, and 3000 or more. Label each band by its lower bound
  (0, 1000, 2000, 3000) and show how many customers fall into each band.
truth_sql: |
  with c as (select customer_id, sum(amount) as rev from orders where customer_id is not null group by 1)
  select (case when rev < 1000 then 0 when rev < 2000 then 1000 when rev < 3000 then 2000 else 3000 end) as band,
         count(*) as customers
  from c group by 1
compare: {keys: [band], values: [customers]}
capabilities:
  - kind: any_of
    options:
      - [{kind: multi_stage}]
      - - kind: trace_pattern
          steps:
            - {tool: create_model, has_args: [query]}
            - {tool: query, uses_model_from_step: 0}
