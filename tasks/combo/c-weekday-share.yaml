id: c-weekday-share
covers: [Q21, Q2]
prompt: >-
  For each day of the week, show the revenue (the sum of order amounts) in 2025 and its share (between 0 and 1) of the
  revenue of the whole year 2025. Number the days the ISO way, Monday = 1 through Sunday = 7.
truth_sql: |
  select isodow(order_date) as day_of_week, sum(amount) as revenue,
         sum(amount) / sum(sum(amount)) over () as share_of_year
  from orders where order_date >= date '2025-01-01' and order_date < date '2026-01-01'
  group by 1
slayer_query: {"query": {"source_model": "orders", "dimensions": [{"expression": "date_part('day_of_week', order_date)", "name": "day_of_week"}], "measures": [{"formula": "sum(amount)", "name": "revenue"}, {"formula": "sum(amount) / sum(amount, partition_by=[])", "name": "share_of_year"}], "filters": ["order_date in '2025'"]}}
compare: {keys: [day_of_week], values: [revenue, share_of_year]}
