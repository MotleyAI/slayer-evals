id: j-q04-monthly-orders-2026
dataset: jaffle
prompt: >-
  Show monthly order count for 2026 so far. Answer with one row per month from January to October 2026, October
  included although it is not over: the month (its first day) and its number of orders.
truth_sql: |
  select cast(date_trunc('month', ordered_at) as date) as month, count(*) as orders
  from orders where ordered_at >= '2026-01-01'
  group by 1
slayer_query: {"query": {"source_model": "orders", "time_dimensions": [{"dimension": "ordered_at", "granularity": "month", "date_range": ["2026-01-01", "2026-12-31"]}], "measures": [{"formula": "count(*)", "name": "orders"}]}}
compare: {keys: [month], values: [orders]}
