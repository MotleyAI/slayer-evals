id: q27-tag-count-groups
covers: [Q27]
prompt: >-
  Group the customers by how many tags they carry: for each number of tags, how many customers carry that many?
  Customers whose tags are not on record form their own group.
truth_sql: |
  select len(list_distinct(list_filter(tags, x -> x is not null))) as tag_count, count(*) as customers
  from customers
  group by 1
# One stage, `length(tags)` as the dimension, once length counts distinct elements (DEV-2209).
slayer_query: {"query": [{"name": "per_customer", "source_model": "customers", "dimensions": ["id", {"expression": "length(tags)", "name": "raw_len"}], "measures": [{"formula": "count_distinct(tags.value)", "name": "n"}]}, {"source_model": "per_customer", "dimensions": [{"expression": "case when raw_len is null then null else n end", "name": "tag_count"}], "measures": [{"formula": "count(*)", "name": "customers"}]}]}
compare: {keys: [tag_count], values: [customers]}
xfail:
  issue: DEV-2209
  reason: SLayer's length counts repeated elements; the truth counts each distinct tag once
  profiles: [slayer, slayer+python, motley, motley+python]
