id: q27-vip-and-eu
covers: [Q27]
prompt: >-
  How many customers carry both the tag vip and the tag eu?
truth_sql: |
  select count(*) as customers from customers where list_has_all(list_filter(tags, x -> x is not null), ['vip', 'eu'])
slayer_query: {"query": {"source_model": "customers", "measures": [{"formula": "count(*)", "name": "customers"}], "filters": ["contains_all(tags, ['vip', 'eu'])"]}}
compare: {values: [customers]}
