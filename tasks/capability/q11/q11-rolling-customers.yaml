id: q11-rolling-customers
covers: [Q11]
prompt: >-
  For each month of 2025, how many distinct customers placed an order in the 90 days ending on the last day of that
  month?
truth_sql: |
  select m as month,
         (select count(distinct customer_id) from orders o
          where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month)
           as customers
  from (select distinct date_trunc('month', order_date)::date as m from orders where order_date >= date '2025-01-01')
slayer_query: {"query": {"source_model": "orders", "time_dimensions": [{"dimension": "order_date", "granularity": "month", "date_range": "2025"}], "measures": [{"formula": "count_distinct(customer_id, window='90d')", "name": "customers"}]}}
compare: {keys: [month], values: [customers]}
