id: q21-weekday-revenue
covers: [Q21]
prompt: >-
  What was the revenue (the sum of order amounts) in 2025 for each day of the week? Number the days the ISO way,
  Monday = 1 through Sunday = 7.
truth_sql: |
  select isodow(order_date) as day_of_week, sum(amount) as revenue from orders
  where order_date >= date '2025-01-01' group by 1
slayer_query: {"query": {"source_model": "orders", "dimensions": [{"expression": "date_part('day_of_week', order_date)", "name": "day_of_week"}], "measures": [{"formula": "sum(amount)", "name": "revenue"}], "filters": ["order_date >= '2025-01-01'"]}}
compare: {keys: [day_of_week], values: [revenue]}
