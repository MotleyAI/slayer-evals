id: q12-net-revenue
covers: [Q12]
prompt: >-
  For each region, sum over its orders the order amount minus the ordering customer's discount value. Orders whose
  customer has no known region form their own group; orders without a customer are left out.
truth_sql: |
  select region, sum(amount - discount) as net_revenue from orders_flat group by 1
slayer_query: {"query": {"source_model": "orders", "dimensions": ["customers.regions.name"], "measures": [{"formula": "sum(amount - customers.discount)", "name": "net_revenue"}]}}
compare: {keys: [region], values: [net_revenue]}
