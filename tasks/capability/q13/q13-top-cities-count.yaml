id: q13-top-cities-count
covers: [Q13]
prompt: >-
  List the three cities with the highest revenue (the sum of order amounts), highest first, showing only each city's
  name and its number of orders, not the revenue.
# A city is a name within a region: the two Oslos are different places.
truth_sql: |
  select city, count(*) as orders from orders_flat where city is not null
  group by region, city order by sum(amount) desc limit 3
slayer_query: {"query": [{"name": "top_cities", "source_model": "orders_flat", "dimensions": ["region", "city"], "measures": [{"formula": "count(*)", "name": "n_orders"}, {"formula": "sum(amount)", "name": "revenue"}], "filters": ["city is not null"], "order": [{"column": "revenue", "direction": "desc"}], "limit": 3}, {"source_model": "top_cities", "dimensions": ["city"], "measures": [{"formula": "sum(n_orders)", "name": "orders"}], "order": [{"column": "sum(revenue)", "direction": "desc"}]}]}
compare: {keys: [city], values: [orders], ordered: true, columns_exact: true}
