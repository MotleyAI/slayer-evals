id: q20-quarter-region
covers: [Q20]
prompt: >-
  What was the revenue (the sum of order amounts) of each region in the first quarter of 2025? Orders whose customer
  has no known region form their own group.
truth_sql: |
  select region, sum(amount) as revenue from orders_flat
  where order_date >= date '2025-01-01' and order_date < date '2025-04-01'
  group by 1
slayer_query: {"query": {"source_model": "orders", "dimensions": ["customers.regions.name"], "measures": [{"formula": "sum(amount)", "name": "revenue"}], "filters": ["order_date in '2025-Q1'"]}}
compare: {keys: [region], values: [revenue]}
