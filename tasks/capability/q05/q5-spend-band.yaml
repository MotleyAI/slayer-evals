id: q5-spend-band
covers: [Q5]
prompt: >-
  Split revenue between orders from high-spend customers and all other orders. A customer is high-spend when their
  total revenue (the sum of all their order amounts) is above 2000. Label the two groups 'high' and 'other'; orders
  without a customer belong to 'other'.
truth_sql: |
  with c as (select customer_id, sum(amount) as total from orders where customer_id is not null group by 1)
  select case when c.total > 2000 then 'high' else 'other' end as band, sum(o.amount) as revenue
  from orders o left join c on o.customer_id = c.customer_id
  group by 1
slayer_query: {"query": {"source_model": "orders", "dimensions": [{"expression": "iif(sum(amount, partition_by=customer_id) > 2000, 'high', 'other')", "name": "band"}], "measures": [{"formula": "sum(amount)", "name": "revenue"}]}}
compare: {keys: [band], values: [revenue]}
