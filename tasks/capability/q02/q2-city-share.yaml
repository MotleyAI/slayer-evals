id: q2-city-share
covers: [Q2]
prompt: >-
  For every region and city, show what fraction (between 0 and 1) of its region's revenue the city accounts for, and
  what fraction of all revenue. Revenue is the sum of order amounts; orders whose customer has no known region or city
  form their own groups.
truth_sql: |
  select region, city,
         sum(amount) / sum(sum(amount)) over (partition by region) as share_of_region,
         sum(amount) / sum(sum(amount)) over () as share_of_total
  from orders_flat group by 1, 2
slayer_query: {"query": {"source_model": "orders_flat", "dimensions": ["region", "city"], "measures": [{"formula": "sum(amount) / sum(amount, partition_by=region)", "name": "share_of_region"}, {"formula": "sum(amount) / sum(amount, partition_by=[])", "name": "share_of_total"}]}}
compare: {keys: [region, city], values: [share_of_region, share_of_total]}
