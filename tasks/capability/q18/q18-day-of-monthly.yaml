id: q18-day-of-monthly
covers: [Q18]
prompt: >-
  Using the monthly revenue summary (monthly_rev), break its revenue down by day for January 2025.
truth_sql: select 1 as nothing where false
slayer_query: {"query": {"source_model": "monthly_rev", "time_dimensions": [{"dimension": "order_date", "granularity": "day", "date_range": "2025-01"}], "measures": [{"formula": "sum(rev)", "name": "revenue"}]}}
uses_saved: ["monthly_rev"]
expect:
  error: TimeDimensionColumnError
  message_any: [bucketed, granularity, "monthly", "per month", "by month", "month level", "month-level"]
