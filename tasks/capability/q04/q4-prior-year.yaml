id: q4-prior-year
covers: [Q4]
prompt: >-
  For each month of the first quarter of 2025, show the revenue (the sum of order amounts) and the revenue of the same
  month one year earlier.
truth_sql: |
  with m as (select date_trunc('month', order_date)::date as month, sum(amount) as revenue from orders group by 1)
  select a.month, a.revenue, b.revenue as prior_year_revenue
  from m a left join m b on b.month = a.month - interval 12 month
  where a.month between date '2025-01-01' and date '2025-03-01'
slayer_query: {"query": {"source_model": "orders", "time_dimensions": [{"dimension": "order_date", "granularity": "month", "date_range": ["2025-01-01", "2025-03-31"]}], "measures": [{"formula": "sum(amount)", "name": "revenue"}, {"formula": "time_shift(sum(amount), -1, 'year')", "name": "prior_year_revenue"}]}}
compare: {keys: [month], values: [revenue, prior_year_revenue]}
