id: q6-region-credit
covers: [Q6]
prompt: >-
  For each region, show the revenue (the sum of order amounts) and the sum of the credit limits of all the region's
  customers, including customers who never ordered. Orders whose customer has no known region form their own group.
truth_sql: |
  with o as (select region, sum(amount) as revenue from orders_flat group by 1),
       c as (select r.name as region, sum(c.credit) as total_credit
             from customers c left join regions r on c.region_id = r.id group by 1)
  select o.region, o.revenue, c.total_credit
  from o left join c on o.region is not distinct from c.region
slayer_query: {"query": {"source_model": "orders", "dimensions": ["customers.regions.name"], "measures": [{"formula": "sum(amount)", "name": "revenue"}, {"formula": "sum(customers.credit)", "name": "total_credit"}]}}
compare: {keys: [region], values: [revenue, total_credit]}
