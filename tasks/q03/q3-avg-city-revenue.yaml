id: q3-avg-city-revenue
row: Q3
prompt: >-
  For each region, what is the average revenue of its cities, where each city's revenue is the sum of its order
  amounts and every city counts once regardless of size? Orders whose customer has no known region form their own
  group.
truth_sql: |
  select region, avg(rev) as avg_city_revenue
  from (select region, city, sum(amount) as rev from orders_flat group by 1, 2)
  group by 1
compare: {keys: [region], values: [avg_city_revenue]}
