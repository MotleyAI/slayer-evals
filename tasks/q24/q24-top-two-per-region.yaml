id: q24-top-two-per-region
row: Q24
prompt: >-
  For each region, list its two customers (by customer id) with the highest revenue, with each customer's revenue and,
  on the same rows, the region's total revenue. Revenue is the sum of order amounts; leave out customers without a
  region.
truth_sql: |
  with cr as (select region, customer_id, sum(amount) as revenue from orders_flat
              where region is not null and customer_id is not null group by 1, 2),
       rt as (select region, sum(amount) as region_revenue from orders_flat where region is not null group by 1)
  select cr.region, cr.customer_id, cr.revenue, rt.region_revenue
  from (select *, rank() over (partition by region order by revenue desc) as rk from cr) cr
  join rt on rt.region = cr.region
  where rk <= 2
compare: {keys: [region, customer_id], values: [revenue, region_revenue]}
capabilities:
  - {kind: call, fn: [rank, dense_rank, row_number], kwarg: partition_by}
  - {kind: call, fn: sum, kwarg: partition_by}
