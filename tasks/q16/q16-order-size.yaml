id: q16-order-size
row: Q16
prompt: >-
  Classify every order as 'big' when its amount is over 100 and 'small' otherwise, without changing the stored data
  model, and show the number of orders and the revenue (sum of amounts) for each class.
truth_sql: |
  select case when amount > 100 then 'big' else 'small' end as size, count(*) as orders, sum(amount) as revenue
  from orders group by 1
compare: {keys: [size], values: [orders, revenue]}
allow:
  - {construct: inline_column_sql, scope: row_scalar}
capabilities:
  - {kind: inline_extension}
