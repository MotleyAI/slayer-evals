id: t-ok-share
covers: [Q2, filtered_total]
prompt: >-
  Looking only at orders with status 'ok': what share (between 0 and 1) of the company's 'ok' revenue does each region
  account for? Revenue is the sum of order amounts; orders whose customer has no known region form their own group.
truth_sql: |
  select region, sum(amount) / (select sum(amount) from orders where status = 'ok') as share
  from orders_flat where status = 'ok'
  group by 1
slayer_query: {"query": {"source_model": "orders_flat", "dimensions": ["region"], "measures": [{"formula": "sum(amount) / sum(amount, partition_by=[])", "name": "share"}], "filters": ["status == 'ok'"]}}
naive_sql: |
  select region, sum(amount) / (select sum(amount) from orders) as share
  from orders_flat where status = 'ok'
  group by 1
compare: {keys: [region], values: [share]}
