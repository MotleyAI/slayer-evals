id: t-prev-month
covers: [Q4, filter_before_window]
prompt: >-
  For each month of the first quarter of 2025, show the revenue (the sum of order amounts) and the revenue of the month
  before it.
truth_sql: |
  with m as (select date_trunc('month', order_date)::date as month, sum(amount) as revenue from orders group by 1)
  select a.month, a.revenue, b.revenue as previous_revenue
  from m a left join m b on b.month = a.month - interval 1 month
  where a.month between date '2025-01-01' and date '2025-03-01'
slayer_query: {"query": {"source_model": "orders", "time_dimensions": [{"dimension": "order_date", "granularity": "month", "date_range": ["2025-01-01", "2025-03-31"]}], "measures": [{"formula": "sum(amount)", "name": "revenue"}, {"formula": "time_shift(sum(amount), -1)", "name": "previous_revenue"}]}}
naive_sql: |
  select date_trunc('month', order_date) as month, sum(amount) as revenue,
         lag(sum(amount)) over (order by date_trunc('month', order_date)) as previous_revenue
  from orders
  where order_date >= date '2025-01-01' and order_date < date '2025-04-01'
  group by 1
compare: {keys: [month], values: [revenue, previous_revenue]}
